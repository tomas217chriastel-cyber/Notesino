<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SchoolBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="bg"></div>

<header class="topbar">
  <div class="brand">📘 SchoolBoard</div>
  <div class="topbar-actions">
    <div id="presenceStrip" class="presence-strip" style="position:static; transform:none;"></div>

    <button id="hostSessionBtn" class="icon-btn" title="Host a live session">🛰️</button>
    <button id="leaveSessionBtn" class="icon-btn" title="Leave session" hidden>🚪</button>
    <span id="sessionCodeDisplay" style="font-family:'SF Mono',monospace; font-size:12px; opacity:0.8;"></span>

    <div class="profile-wrap" style="position:relative;">
      <button id="profileBtn" class="icon-btn" title="Account">👤</button>
      <div id="profileMenu" class="add-menu" style="right:0; bottom:auto; top:46px;">
        <div style="padding:8px 12px; font-size:13px;">
          <div id="userDisplayName" style="font-weight:600;"></div>
          <div style="opacity:0.7; margin-top:2px;">Friend code: <b id="friendCodeDisplay"></b></div>
        </div>
        <button id="openFriendsBtn">👥 Friends</button>
        <button id="signOutBtn">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div id="authDisabledNotice" hidden style="position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:900; background:rgba(255,209,102,0.95); color:#16161c; padding:8px 14px; border-radius:10px; font-size:12px; max-width:90vw; text-align:center;">
  Accounts, friends, and live sessions need a Firebase project — see README → "Wiring up your own Firebase project". The canvas below still works fully offline.
</div>

<div id="inviteBanner" hidden style="position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:900; background:#14141e; color:#fff; padding:10px 14px; border-radius:12px; font-size:13px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 24px rgba(0,0,0,0.4);">
  <span id="inviteText"></span>
  <button id="inviteAcceptBtn" class="fmt-btn" style="width:auto; padding:0 10px;">Join</button>
  <button id="inviteDeclineBtn" class="fmt-btn" style="width:auto; padding:0 10px;">Dismiss</button>
</div>

<div id="canvasViewport" class="canvas-viewport">
  <div id="canvasLayer" class="canvas-layer"></div>
</div>

<div class="add-menu-wrap">
  <div id="addMenu" class="add-menu">
    <button id="addTimetableBtn">📅 Timetable</button>
    <button id="addNoteBtn">🗒️ Sticky note</button>
  </div>
  <button id="addMenuBtn" class="add-menu-btn" aria-label="Add">+</button>
</div>

<!-- ---------- Auth modal ---------- -->
<div id="authModal" class="modal-backdrop" hidden>
  <div class="modal modal-inner">
    <button id="authCloseBtn" class="close-x" aria-label="Close">&times;</button>
    <h2>Sign in to SchoolBoard</h2>
    <p id="authError" class="tt-badge" style="background:#e5484d; display:block;" hidden></p>

    <label for="authName">Name</label>
    <input id="authName" type="text" autocomplete="name" placeholder="Alex">
    <label for="authEmail">Email</label>
    <input id="authEmail" type="email" autocomplete="email" placeholder="you@school.edu">
    <label for="authPassword">Password</label>
    <input id="authPassword" type="password" autocomplete="current-password">
    <div class="btn-row">
      <button id="authSignInBtn" class="btn">Sign in</button>
      <button id="authSignUpBtn" class="btn secondary">Create account</button>
    </div>

    <div class="divider">or</div>
    <button id="authGoogleBtn" class="btn secondary">Continue with Google</button>
    <button id="authAppleBtn" class="btn secondary">Continue with Apple</button>

    <div class="divider">or with phone</div>
    <label for="authPhoneNumber">Phone number</label>
    <input id="authPhoneNumber" type="tel" autocomplete="tel" placeholder="+1 555 123 4567">
    <button id="authPhoneSendBtn" class="btn secondary">Send code</button>
    <div id="authPhoneCodeRow" hidden>
      <label for="authPhoneCode">Verification code</label>
      <input id="authPhoneCode" type="text" inputmode="numeric" placeholder="123456">
      <button id="authPhoneVerifyBtn" class="btn">Verify & sign in</button>
    </div>
    <div id="recaptcha-container"></div>
  </div>
</div>

<!-- ---------- Friends modal ---------- -->
<div id="friendsModal" class="modal-backdrop" hidden>
  <div class="modal modal-inner">
    <button id="friendsCloseBtn" class="close-x" aria-label="Close">&times;</button>
    <h2>Friends</h2>
    <div class="friend-code" id="friendCodeDisplay2"></div>
    <p id="friendsError" class="tt-badge" style="background:#e5484d; display:block;" hidden></p>
    <label for="friendCodeInput">Add a friend by code</label>
    <input id="friendCodeInput" type="text" placeholder="ABC123" style="text-transform:uppercase;">
    <button id="addFriendBtn" class="btn">Add friend</button>
    <ul id="friendsList" class="friend-list"></ul>

    <div class="divider">join a session</div>
    <input id="joinSessionInput" type="text" placeholder="Session code" style="text-transform:uppercase;">
    <button id="joinSessionBtn" class="btn secondary">Join</button>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/firebase-boot.js"></script>
<script src="js/platform.js"></script>
<script src="js/canvas.js"></script>
<script src="js/notes.js"></script>
<script src="js/timetable.js"></script>
<script src="js/auth.js"></script>
<script src="js/friends.js"></script>
<script src="js/presence.js"></script>
<script src="js/app.js"></script>
</body>
</html>
