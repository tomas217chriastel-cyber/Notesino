name: Build Android APK

# Builds the debug-signed APK on every push that touches the app, uploads it
# as a workflow artifact, and republishes it on the "latest" release so the
# phone always has the same download link:
#   https://github.com/<owner>/<repo>/releases/download/latest/notesino-debug-signed.apk
#
# Signing: Android only installs an update over the existing app if it is
# signed with the same key. Put a base64-encoded debug.keystore into the repo
# secret DEBUG_KEYSTORE_BASE64 to keep the key stable across builds.
# Without it, each build gets a fresh key (uninstall before installing).

on:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-build-tools android-sdk-platform-23 \
            android-sdk-platform-tools dalvik-exchange

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/debug.keystore
            echo "Using stable signing key from secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set: this APK has a new signing key and won't install over an older build."
          fi

      - name: Build APK
        run: bash android/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesino-apk
          path: android/build/apk/notesino-debug-signed.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest android/build/apk/notesino-debug-signed.apk \
            --target "$GITHUB_SHA" \
            --title "Notesino (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open this page on your phone and tap the .apk to install."
